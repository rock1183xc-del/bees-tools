<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我愛里蜂群好用工具集錦</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1 class="title">我愛里蜂群好用工具集錦</h1>
    <nav class="header-actions" aria-label="功能選單">
      <button type="button" class="btn btn-settings" id="btnSettings">介面設定</button>
      <button type="button" class="btn btn-admin" id="btnAdmin">管理者</button>
    </nav>
  </header>

  <main class="main" id="mainContent">
    <p class="loading" id="loading">載入中…</p>
    <p class="error hidden" id="error"></p>
    <div class="cards-container" id="cardsContainer">
      <!-- 卡片由 JS 動態產生 -->
    </div>
  </main>

  <!-- 介面設定 Modal（一般使用者） -->
  <div class="modal hidden" id="modalSettings" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>外觀設定</h2>
        <button type="button" class="modal-close" id="closeSettings">&times;</button>
      </div>
      <div class="modal-body">
        <label>主題色</label>
        <input type="color" id="inputPrimaryColor" value="#e6a700">
        <label>字體大小</label>
        <select id="inputFontSize">
          <option value="small">小</option>
          <option value="medium" selected>中</option>
          <option value="large">大</option>
        </select>
        <label>卡片間距</label>
        <select id="inputCardSpacing">
          <option value="compact">緊湊</option>
          <option value="normal" selected>一般</option>
          <option value="relaxed">寬鬆</option>
        </select>
        <label>卡片圓角</label>
        <select id="inputCardRadius">
          <option value="small">小</option>
          <option value="medium" selected>中</option>
          <option value="large">大</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="saveSettings">儲存</button>
      </div>
    </div>
  </div>

  <!-- 管理者 Modal（新增/編輯工具卡片） -->
  <div class="modal hidden" id="modalAdmin" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2>管理工具</h2>
          <p class="modal-subtitle">新增或編輯工具卡片</p>
        </div>
        <button type="button" class="modal-close" id="closeAdmin">&times;</button>
      </div>
      <div class="modal-body">
        <label>管理者密碼</label>
        <input type="password" id="adminPassword" placeholder="請輸入密碼">
        <label>類型</label>
        <select id="toolType">
          <option value="link">一般連結</option>
          <option value="plugin">插件下載</option>
        </select>
        <p class="form-hint" id="toolTypeHint">點擊卡片會開啟連結。</p>
        <label>工具名稱</label>
        <input type="text" id="toolName" placeholder="必填">
        <label id="labelToolUrl">網址</label>
        <input type="url" id="toolUrl" placeholder="https://...">
        <label>簡短說明（選填）</label>
        <input type="text" id="toolDescription" placeholder="選填">
        <p class="admin-message hidden" id="adminMessage"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="submitTool">新增</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
